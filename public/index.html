<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shrushti's Assistant 🌷</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #fff0f3;
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .app-card {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    header {
      padding: 14px 18px;
      background: #ff5d8f;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar { font-size: 22px; }
    .title h1 { font-size: 1rem; font-weight: 700; }
    .title p { font-size: 0.72rem; opacity: 0.9; }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-wrap { display: flex; flex-direction: column; max-width: 82%; }
    .msg-wrap.user { align-self: flex-end; }
    .msg-wrap.bot { align-self: flex-start; }
    .msg-bubble {
      padding: 11px 15px;
      font-size: 0.92rem;
      line-height: 1.4;
      border-radius: 18px;
    }
    .msg-wrap.user .msg-bubble {
      background: #ff5d8f;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg-wrap.bot .msg-bubble {
      background: #f8f9fa;
      color: #333;
      border-bottom-left-radius: 4px;
      border: 1px solid #eee;
    }

    .shortcuts-bar {
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      background: #fff5f7;
    }
    .chip {
      background: white;
      border: 1px solid #ffd1dc;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .input-bar {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #ffe1e6;
      background: white;
    }
    .input-field {
      flex: 1;
      border: 1px solid #ffd1dc;
      border-radius: 20px;
      padding: 10px 14px;
      font-size: 0.92rem;
      outline: none;
    }
    .btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .mic-btn { background: #ffe1e6; font-size: 18px; }
    .mic-btn.active { background: #ff5d8f; color: white; }
    .send-btn { background: #ff5d8f; color: white; font-weight: bold; }
  </style>
</head>
<body>

<div class="app-card">
  <header>
    <div class="avatar">🌷</div>
    <div class="title">
      <h1>Shrushti's Assistant</h1>
      <p>Aadi's Gift</p>
    </div>
  </header>

  <div id="chat-box"></div>

  <div class="shortcuts-bar">
    <div class="chip" onclick="quickSend('माझं आवडतं गाणं लाव')">🎵 गाणं लाव</div>
    <div class="chip" onclick="quickSend('मला अभ्यासात मदत हवी आहे')">📚 अभ्यास</div>
    <div class="chip" onclick="quickSend('मला थोडं बोर होतंय')">☕ बोर होतंय</div>
    <div class="chip" onclick="quickSend('YouTube उघड')">▶️ YouTube</div>
  </div>

  <div class="input-bar">
    <button class="btn mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
    <input type="text" id="userInput" class="input-field" placeholder="काहीही विचार..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button class="btn send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<audio id="player"></audio>

<script>
  const OPENROUTER_KEY = "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";
  const FISH_KEY = "sk-fish-7meDj3dZkXn-uwylFbtkKuaJ_KqAkw3CkHNeHmIr4iE";
  const VOICE_ID = "1e786eebb4f34790b8004442ddc62709";

  const SYSTEM_PROMPT = `Tu Shrushti cha personal friendly AI assistant ahes. Shrushti 11th class madhe shikte. Ticha bhau Aadi ahe.
Niyam:
1. Normal, cool ani natural mitrasarkh bol. Kitabi kinva formal nako.
2. Tila kadhich direct 'nahi' bolu nako.
3. Jevha ti gaana lavayla sangel tevha [ACTION:PLAY:<gana>] as shevti lihi.
4. Jevha YouTube ughdayla sangel tevha [ACTION:OPEN:YOUTUBE] as lihi.
5. Uttar Marathi kinva Hinglish madhe chota ani mast de.`;

  const chatBox = document.getElementById('chat-box');
  const player = document.getElementById('player');
  const micBtn = document.getElementById('micBtn');

  window.onload = () => {
    const welcome = "Hey Shrushti! Happy Birthday! 🌷 Aadine khas tuzhyasathi ha assistant banvun dilay. Bol, aaj kay plan ahe?";
    appendMessage('bot', welcome);
    speakText(welcome);
  };

  function appendMessage(sender, text) {
    const wrap = document.createElement('div');
    wrap.className = `msg-wrap ${sender}`;
    wrap.innerHTML = `<div class="msg-bubble">${text.replace(/\[ACTION:[^\]]+\]/g, '')}</div>`;
    chatBox.appendChild(wrap);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function speakText(text) {
    const clean = text.replace(/\[ACTION:[^\]]+\]/g, '').trim();
    try {
      const res = await fetch('https://api.fish.audio/v1/tts', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${FISH_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          text: clean,
          reference_id: VOICE_ID,
          format: 'mp3'
        })
      });
      if (res.ok) {
        const blob = await res.blob();
        player.src = URL.createObjectURL(blob);
        player.play();
      }
    } catch (e) {}
  }

  function quickSend(t) {
    document.getElementById('userInput').value = t;
    sendMessage();
  }

  let recognition;
  function toggleMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Chrome browser vapra mic sathi.");
      return;
    }
    if (!recognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'mr-IN';
      recognition.onstart = () => micBtn.classList.add('active');
      recognition.onend = () => micBtn.classList.remove('active');
      recognition.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        sendMessage();
      };
    }
    recognition.start();
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    appendMessage('user', text);
    input.value = '';

    try {
      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${OPENROUTER_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: 'meta-llama/llama-3.3-70b-instruct:free',
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            { role: 'user', content: text }
          ]
        })
      });

      const data = await response.json();
      const reply = data.choices[0].message.content;

      appendMessage('bot', reply);
      speakText(reply);

      if (reply.includes('[ACTION:PLAY:')) {
        const song = reply.split('[ACTION:PLAY:')[1].split(']')[0];
        setTimeout(() => window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(song)}`, '_blank'), 1500);
      } else if (reply.includes('[ACTION:OPEN:YOUTUBE]')) {
        setTimeout(() => window.open('https://www.youtube.com', '_blank'), 1500);
      }
    } catch (err) {
      appendMessage('bot', 'Network problem aala, parat try kar.');
    }
  }
</script>

</body>
</html>
